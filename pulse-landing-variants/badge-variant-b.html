<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Badge Variant B - Minimal Outlined</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: linear-gradient(165deg, #000000 0%, #071a12 40%, #0a2a1a 70%, #0d1f17 100%);
      --text: #f9fafb;
      --muted: #9ca3af;
      --emr: #6b7280;
      --emt: #3b82f6;
      --aemt: #10b981;
      --pmdc: #f59e0b;
      --cc: #f43f5e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: "Poppins", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(920px, calc(100vw - 32px));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 46px;
      padding: 56px 0;
    }

    .section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .section-title {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      width: 100%;
    }

    .badge {
      --color: var(--emr);
      width: 90px;
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 12px;
      border: 1.5px solid color-mix(in srgb, var(--color) 88%, transparent);
      border-radius: 999px;
      background: color-mix(in srgb, var(--color) 5%, transparent);
      box-shadow: 0 0 14px color-mix(in srgb, var(--color) 20%, transparent);
      color: color-mix(in srgb, var(--color) 82%, white);
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      text-align: center;
    }

    .badge svg {
      width: 13px;
      height: 13px;
      flex: 0 0 auto;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .badge.emr {
      --color: var(--emr);
    }

    .badge.emt {
      --color: var(--emt);
    }

    .badge.aemt {
      --color: var(--aemt);
    }

    .badge.pmdc {
      --color: var(--pmdc);
    }

    .badge.cc {
      --color: var(--cc);
      min-height: 44px;
      flex-direction: column;
      gap: 3px;
      border-style: dashed;
      border-color: color-mix(in srgb, var(--cc) 50%, transparent);
      background: color-mix(in srgb, var(--cc) 4%, transparent);
      box-shadow: 0 0 12px color-mix(in srgb, var(--cc) 14%, transparent);
      color: color-mix(in srgb, var(--cc) 62%, #9ca3af);
    }

    .badge-main {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      line-height: 1;
    }

    .coming-soon {
      display: block;
      color: color-mix(in srgb, currentColor 72%, #9ca3af);
      font-size: 7px;
      font-weight: 700;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    .badge.selected {
      background: color-mix(in srgb, var(--color) 15%, transparent);
      border-color: color-mix(in srgb, var(--color) 96%, white);
      box-shadow: 0 0 18px color-mix(in srgb, var(--color) 36%, transparent);
      color: color-mix(in srgb, var(--color) 70%, white);
    }

    .compact-row {
      gap: 9px;
    }

    .badge.compact {
      width: 74px;
      min-height: 31px;
      gap: 5px;
      padding: 6px 10px;
      border-width: 1.5px;
      box-shadow: 0 0 12px color-mix(in srgb, var(--color) 18%, transparent);
      font-size: 10px;
    }

    .badge.compact svg {
      width: 11px;
      height: 11px;
    }

    .badge.compact.cc {
      min-height: 38px;
      gap: 2px;
    }

    .badge.compact .coming-soon {
      font-size: 6px;
      letter-spacing: 0.06em;
    }

    @media (max-width: 520px) {
      main {
        width: min(360px, calc(100vw - 28px));
        gap: 38px;
        padding: 44px 0;
      }

      .badge-row {
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <main aria-label="Pulse by MedEdPrep certification badge variants">
    <section class="section" aria-labelledby="default-heading">
      <h2 class="section-title" id="default-heading">Default</h2>
      <div class="badge-row">
        <div class="badge emr">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
          <span>EMR</span>
        </div>
        <div class="badge emt">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
          <span>EMT</span>
        </div>
        <div class="badge aemt">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
          <span>AEMT</span>
        </div>
        <div class="badge pmdc">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
          <span>PMDC</span>
        </div>
        <div class="badge cc">
          <span class="badge-main">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
            <span>CC</span>
          </span>
          <span class="coming-soon">Coming Soon</span>
        </div>
      </div>
    </section>

    <section class="section" aria-labelledby="selected-heading">
      <h2 class="section-title" id="selected-heading">Selected State</h2>
      <div class="badge-row">
        <div class="badge emr">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
          <span>EMR</span>
        </div>
        <div class="badge emt selected">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
          <span>EMT</span>
        </div>
        <div class="badge aemt">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
          <span>AEMT</span>
        </div>
        <div class="badge pmdc">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
          <span>PMDC</span>
        </div>
        <div class="badge cc">
          <span class="badge-main">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
            <span>CC</span>
          </span>
          <span class="coming-soon">Coming Soon</span>
        </div>
      </div>
    </section>

    <section class="section" aria-labelledby="compact-heading">
      <h2 class="section-title" id="compact-heading">Compact</h2>
      <div class="badge-row compact-row">
        <div class="badge compact emr">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
          <span>EMR</span>
        </div>
        <div class="badge compact emt">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
          <span>EMT</span>
        </div>
        <div class="badge compact aemt">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
          <span>AEMT</span>
        </div>
        <div class="badge compact pmdc">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
          <span>PMDC</span>
        </div>
        <div class="badge compact cc">
          <span class="badge-main">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
            <span>CC</span>
          </span>
          <span class="coming-soon">Coming Soon</span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
