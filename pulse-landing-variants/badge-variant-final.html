<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certification Level Badges — Refined</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      background: linear-gradient(165deg, #000000 0%, #071a12 40%, #0a2a1a 70%, #0d1f17 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 60px;
      padding: 60px 24px;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 600px 400px at 20% 30%, rgba(16, 185, 129, 0.04) 0%, transparent 70%),
        radial-gradient(ellipse 500px 350px at 80% 60%, rgba(59, 130, 246, 0.03) 0%, transparent 70%);
      pointer-events: none;
    }

    .section {
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .section-title {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.45);
      margin-bottom: 28px;
    }

    .section-subtitle {
      font-size: 11px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.25);
      margin-top: -18px;
      margin-bottom: 28px;
    }

    .badge-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    /* ─── Base Badge ─── */
    .badge {
      position: relative;
      min-width: 110px;
      padding: 12px 16px 14px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
      user-select: none;

      background: linear-gradient(
        145deg,
        rgba(255, 255, 255, 0.05) 0%,
        rgba(255, 255, 255, 0.02) 50%,
        rgba(0, 0, 0, 0.08) 100%
      );
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid var(--badge-color);
    }

    /* Inner light reflection */
    .badge::before {
      content: '';
      position: absolute;
      top: 0;
      left: 10%;
      right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--badge-color-bright, rgba(255,255,255,0.3)) 50%, transparent);
      opacity: 0.5;
    }

    .badge-icon { width: 16px; height: 16px; flex-shrink: 0; }
    .badge-icon svg { width: 100%; height: 100%; }

    .badge-label {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--badge-color);
      white-space: nowrap;
    }

    .badge-coming-soon {
      font-size: 7px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--badge-color);
      opacity: 0.5;
      position: absolute;
      bottom: 3px;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
    }

    /* ─── Color Variants ─── */
    .badge--emr {
      --badge-color: #6B7280;
      --badge-color-bright: rgba(107, 114, 128, 0.5);
      --badge-color-fill: rgba(107, 114, 128, 0.12);
      box-shadow:
        0 0 12px rgba(107, 114, 128, 0.12),
        0 0 30px rgba(107, 114, 128, 0.06),
        inset 0 0 20px rgba(107, 114, 128, 0.03);
    }

    .badge--emt {
      --badge-color: #3B82F6;
      --badge-color-bright: rgba(59, 130, 246, 0.6);
      --badge-color-fill: rgba(59, 130, 246, 0.12);
      box-shadow:
        0 0 15px rgba(59, 130, 246, 0.15),
        0 0 40px rgba(59, 130, 246, 0.08),
        inset 0 0 20px rgba(59, 130, 246, 0.04);
    }

    .badge--aemt {
      --badge-color: #10B981;
      --badge-color-bright: rgba(16, 185, 129, 0.6);
      --badge-color-fill: rgba(16, 185, 129, 0.12);
      box-shadow:
        0 0 15px rgba(16, 185, 129, 0.15),
        0 0 40px rgba(16, 185, 129, 0.08),
        inset 0 0 20px rgba(16, 185, 129, 0.04);
    }

    .badge--pmdc {
      --badge-color: #F59E0B;
      --badge-color-bright: rgba(245, 158, 11, 0.6);
      --badge-color-fill: rgba(245, 158, 11, 0.12);
      box-shadow:
        0 0 15px rgba(245, 158, 11, 0.15),
        0 0 40px rgba(245, 158, 11, 0.08),
        inset 0 0 20px rgba(245, 158, 11, 0.04);
    }

    .badge--cc {
      --badge-color: rgba(244, 63, 94, 0.3);
      --badge-color-bright: rgba(244, 63, 94, 0.15);
      --badge-color-fill: rgba(244, 63, 94, 0.06);
      box-shadow:
        0 0 10px rgba(244, 63, 94, 0.05),
        inset 0 0 15px rgba(244, 63, 94, 0.02);
      opacity: 0.6;
      cursor: default;
      padding-bottom: 20px;
      border-style: dashed;
    }

    /* ─── Hover ─── */
    .badge:not(.badge--cc):not(.badge--selected):hover {
      transform: translateY(-2px);
      border-color: var(--badge-color);
      box-shadow:
        0 0 20px color-mix(in srgb, var(--badge-color) 25%, transparent),
        0 0 50px color-mix(in srgb, var(--badge-color) 12%, transparent),
        inset 0 0 25px color-mix(in srgb, var(--badge-color) 06%, transparent);
    }

    /* ─── Selected State — STRONG contrast ─── */
    .badge--selected {
      background: var(--badge-color-fill);
      border-width: 2px;
      transform: scale(1.05);
      z-index: 2;
    }

    .badge--selected .badge-label {
      color: #fff;
      text-shadow: 0 0 16px var(--badge-color);
    }

    .badge--selected .badge-icon svg {
      filter: drop-shadow(0 0 6px var(--badge-color));
    }

    /* Per-color selected glow amplification */
    .badge--selected.badge--emr {
      box-shadow:
        0 0 20px rgba(107, 114, 128, 0.3),
        0 0 50px rgba(107, 114, 128, 0.15),
        0 0 80px rgba(107, 114, 128, 0.06),
        inset 0 0 30px rgba(107, 114, 128, 0.08);
    }
    .badge--selected.badge--emt {
      box-shadow:
        0 0 20px rgba(59, 130, 246, 0.4),
        0 0 50px rgba(59, 130, 246, 0.2),
        0 0 100px rgba(59, 130, 246, 0.08),
        inset 0 0 30px rgba(59, 130, 246, 0.1);
    }
    .badge--selected.badge--aemt {
      box-shadow:
        0 0 20px rgba(16, 185, 129, 0.4),
        0 0 50px rgba(16, 185, 129, 0.2),
        0 0 100px rgba(16, 185, 129, 0.08),
        inset 0 0 30px rgba(16, 185, 129, 0.1);
    }
    .badge--selected.badge--pmdc {
      box-shadow:
        0 0 20px rgba(245, 158, 11, 0.4),
        0 0 50px rgba(245, 158, 11, 0.2),
        0 0 100px rgba(245, 158, 11, 0.08),
        inset 0 0 30px rgba(245, 158, 11, 0.1);
    }

    /* ─── Divider ─── */
    .divider {
      width: 200px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
    }

    /* ─── Lock & Check SVG templates ─── */
    .icon-lock { color: var(--badge-color); }
    .icon-check { color: var(--badge-color); }
    .badge--selected .icon-lock { display: none; }
    .badge--selected .icon-check { display: block; }
    .badge:not(.badge--selected) .icon-check { display: none; }

    /* ─── Responsive ─── */
    @media (max-width: 640px) {
      .badge-row { gap: 8px; }
      .badge { min-width: 90px; padding: 10px 12px 12px; }
      .badge-label { font-size: 11px; }
      .badge--cc { padding-bottom: 18px; }
    }
  </style>
</head>
<body>

  <!-- ═══ Row 1: Default — click to select ═══ -->
  <div class="section">
    <div class="section-title">Your Certification Level</div>
    <div class="section-subtitle">Click a badge to select</div>
    <div class="badge-row" id="row-interactive">

      <div class="badge badge--emr" onclick="selectBadge(this)">
        <div class="badge-icon">
          <svg class="icon-lock" viewBox="0 0 20 20" fill="none"><rect x="4" y="8" width="12" height="9" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 8V6a3 3 0 0 1 6 0v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="10" cy="13" r="1.5" fill="currentColor"/></svg>
          <svg class="icon-check" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M6.5 10.5l2.5 2.5 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <span class="badge-label">EMR</span>
      </div>

      <div class="badge badge--emt badge--selected" onclick="selectBadge(this)">
        <div class="badge-icon">
          <svg class="icon-lock" viewBox="0 0 20 20" fill="none"><rect x="4" y="8" width="12" height="9" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 8V6a3 3 0 0 1 6 0v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="10" cy="13" r="1.5" fill="currentColor"/></svg>
          <svg class="icon-check" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M6.5 10.5l2.5 2.5 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <span class="badge-label">EMT</span>
      </div>

      <div class="badge badge--aemt" onclick="selectBadge(this)">
        <div class="badge-icon">
          <svg class="icon-lock" viewBox="0 0 20 20" fill="none"><rect x="4" y="8" width="12" height="9" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 8V6a3 3 0 0 1 6 0v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="10" cy="13" r="1.5" fill="currentColor"/></svg>
          <svg class="icon-check" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M6.5 10.5l2.5 2.5 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <span class="badge-label">AEMT</span>
      </div>

      <div class="badge badge--pmdc" onclick="selectBadge(this)">
        <div class="badge-icon">
          <svg class="icon-lock" viewBox="0 0 20 20" fill="none"><rect x="4" y="8" width="12" height="9" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 8V6a3 3 0 0 1 6 0v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="10" cy="13" r="1.5" fill="currentColor"/></svg>
          <svg class="icon-check" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M6.5 10.5l2.5 2.5 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <span class="badge-label">Paramedic</span>
      </div>

      <div class="badge badge--cc">
        <div class="badge-icon">
          <svg class="icon-lock" viewBox="0 0 20 20" fill="none"><rect x="4" y="8" width="12" height="9" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 8V6a3 3 0 0 1 6 0v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="10" cy="13" r="1.5" fill="currentColor"/></svg>
        </div>
        <span class="badge-label">Critical Care</span>
        <span class="badge-coming-soon">Coming Soon</span>
      </div>

    </div>
  </div>

  <div class="divider"></div>

  <!-- ═══ Row 2: Static showcase — each level selected ═══ -->
  <div class="section">
    <div class="section-title">Selected States (each level)</div>
    <div class="badge-row">

      <div class="badge badge--emr badge--selected">
        <div class="badge-icon">
          <svg class="icon-lock" viewBox="0 0 20 20" fill="none"><rect x="4" y="8" width="12" height="9" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 8V6a3 3 0 0 1 6 0v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="10" cy="13" r="1.5" fill="currentColor"/></svg>
          <svg class="icon-check" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M6.5 10.5l2.5 2.5 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <span class="badge-label">EMR</span>
      </div>

      <div class="badge badge--emt badge--selected">
        <div class="badge-icon">
          <svg class="icon-lock" viewBox="0 0 20 20" fill="none"><rect x="4" y="8" width="12" height="9" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 8V6a3 3 0 0 1 6 0v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="10" cy="13" r="1.5" fill="currentColor"/></svg>
          <svg class="icon-check" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M6.5 10.5l2.5 2.5 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <span class="badge-label">EMT</span>
      </div>

      <div class="badge badge--aemt badge--selected">
        <div class="badge-icon">
          <svg class="icon-lock" viewBox="0 0 20 20" fill="none"><rect x="4" y="8" width="12" height="9" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 8V6a3 3 0 0 1 6 0v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="10" cy="13" r="1.5" fill="currentColor"/></svg>
          <svg class="icon-check" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M6.5 10.5l2.5 2.5 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <span class="badge-label">AEMT</span>
      </div>

      <div class="badge badge--pmdc badge--selected">
        <div class="badge-icon">
          <svg class="icon-lock" viewBox="0 0 20 20" fill="none"><rect x="4" y="8" width="12" height="9" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 8V6a3 3 0 0 1 6 0v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="10" cy="13" r="1.5" fill="currentColor"/></svg>
          <svg class="icon-check" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M6.5 10.5l2.5 2.5 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <span class="badge-label">Paramedic</span>
      </div>

    </div>
  </div>

  <script>
    function selectBadge(el) {
      if (el.classList.contains('badge--cc')) return;
      var row = el.closest('.badge-row');
      row.querySelectorAll('.badge').forEach(function(b) { b.classList.remove('badge--selected'); });
      el.classList.add('badge--selected');
    }
  </script>

</body>
</html>
