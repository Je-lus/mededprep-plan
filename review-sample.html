<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMT Exit Exam — 60 Question Sample Review</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #232733;
    --border: #2e3345;
    --text: #e2e4ea;
    --text-dim: #9da1b5;
    --accent-sam: #f59e0b;
    --accent-sam-bg: rgba(245,158,11,0.12);
    --accent-v1: #3b82f6;
    --accent-v1-bg: rgba(59,130,246,0.12);
    --correct: #22c55e;
    --correct-bg: rgba(34,197,94,0.10);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }

  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 32px 24px;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 12px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .header h1 {
    font-size: 24px;
    font-weight: 600;
    margin-bottom: 8px;
    letter-spacing: -0.3px;
  }
  .header p {
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1.5;
  }

  /* Legend */
  .legend {
    display: flex;
    justify-content: center;
    gap: 24px;
    padding: 14px 0;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-dim);
  }
  .legend-dot {
    width: 12px;
    height: 12px;
    border-radius: 3px;
  }
  .legend-dot.sam { background: var(--accent-sam); }
  .legend-dot.v1 { background: var(--accent-v1); }
  .legend-count {
    font-weight: 600;
    color: var(--text);
  }

  /* Controls */
  .controls {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    flex-wrap: wrap;
    align-items: center;
  }
  .ctrl-btn {
    padding: 7px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .ctrl-btn:hover { border-color: var(--text-dim); color: var(--text); }
  .ctrl-btn.active { border-color: var(--accent-v1); color: var(--accent-v1); background: var(--accent-v1-bg); }
  .ctrl-spacer { flex: 1; }
  .ctrl-btn.toggle-answers {
    border-color: var(--correct);
    color: var(--correct);
    background: var(--correct-bg);
  }

  /* Question card */
  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 16px;
    position: relative;
    border-left: 4px solid var(--border);
    transition: border-color 0.2s;
  }
  .question-card.source-samantha { border-left-color: var(--accent-sam); }
  .question-card.source-working { border-left-color: var(--accent-v1); }

  .q-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .q-number {
    font-size: 13px;
    color: var(--text-dim);
    font-weight: 600;
  }
  .q-meta {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .q-topic {
    font-size: 11px;
    color: var(--text-dim);
    background: var(--surface2);
    padding: 3px 10px;
    border-radius: 12px;
  }
  .q-source {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 12px;
    font-weight: 600;
  }
  .q-source.samantha {
    background: var(--accent-sam-bg);
    color: var(--accent-sam);
  }
  .q-source.working {
    background: var(--accent-v1-bg);
    color: var(--accent-v1);
  }

  .q-text {
    font-size: 16px;
    line-height: 1.55;
    margin-bottom: 16px;
  }

  .q-answers {
    list-style: none;
    margin-bottom: 0;
  }
  .q-answers li {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 6px;
    font-size: 14px;
    line-height: 1.45;
    transition: all 0.2s;
  }
  .q-answers li.correct {
    border-color: var(--correct);
    background: var(--correct-bg);
  }
  .q-answers li .letter {
    color: var(--text-dim);
    font-weight: 600;
    margin-right: 8px;
    font-size: 12px;
  }
  .q-answers li.correct .letter {
    color: var(--correct);
  }

  .q-explanation {
    display: none;
    margin-top: 12px;
    padding: 12px;
    background: var(--surface2);
    border-radius: 8px;
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.55;
    border-left: 3px solid var(--correct);
  }
  .q-explanation.visible { display: block; }

  .q-explain-btn {
    display: inline-block;
    margin-top: 10px;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    text-decoration: underline;
    padding: 0;
  }
  .q-explain-btn:hover { color: var(--text); }

  /* Back to top */
  .back-top {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 40px;
    height: 40px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text-dim);
    font-size: 18px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    z-index: 10;
  }
  .back-top:hover { border-color: var(--text-dim); color: var(--text); }
  .back-top.visible { display: flex; }

  @media print {
    .controls, .back-top { display: none !important; }
    .question-card { break-inside: avoid; }
    body { background: #fff; color: #111; }
    .q-answers li { background: #f5f5f5; border-color: #ddd; }
    .q-answers li.correct { background: #e8f5e9; border-color: #4caf50; }
  }

  @media (max-width: 600px) {
    .container { padding: 16px 12px; }
    .question-card { padding: 16px; }
    .q-header { flex-direction: column; align-items: flex-start; gap: 8px; }
    .controls { gap: 6px; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>EMT Final Exit Exam — Sample Review</h1>
    <p>30 questions from each version, randomized. Review the question quality side by side.</p>
  </div>

  <div class="legend">
    <div class="legend-item">
      <div class="legend-dot sam"></div>
      <span>Samantha's Version</span>
      <span class="legend-count">(30)</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot v1"></div>
      <span>V1 (Working Exit Exam)</span>
      <span class="legend-count">(30)</span>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl-btn active" onclick="filterSource('all')" id="filterAll">All (60)</button>
    <button class="ctrl-btn" onclick="filterSource('samantha')" id="filterSam">Samantha's</button>
    <button class="ctrl-btn" onclick="filterSource('working')" id="filterV1">V1</button>
    <div class="ctrl-spacer"></div>
    <button class="ctrl-btn toggle-answers" onclick="toggleAllCorrect()" id="toggleBtn">Show Correct Answers</button>
  </div>

  <div id="questionList"></div>
</div>

<button class="back-top" id="backTop" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="Back to top">&uarr;</button>

<script src="review_sample_data.js"></script>
<script>
const LETTERS = ['A','B','C','D','E','F'];
let showCorrect = false;
let currentFilter = 'all';

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderQuestions() {
  const list = document.getElementById('questionList');
  list.innerHTML = '';

  let filtered = SAMPLE_QUESTIONS;
  if (currentFilter !== 'all') {
    filtered = filtered.filter(q => q.s === currentFilter);
  }

  filtered.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = `question-card source-${q.s}`;

    // Shuffle answers for display
    const indices = q.a.map((_, i) => i);
    const shuffled = shuffle(indices);
    const correctDisplay = shuffled.indexOf(0);

    const sourceLabel = q.s === 'samantha' ? "Samantha's" : 'V1';
    const sourceClass = q.s === 'samantha' ? 'samantha' : 'working';

    let answersHtml = '';
    shuffled.forEach((origIdx, dispIdx) => {
      const isCorrect = origIdx === 0 && showCorrect;
      const cls = isCorrect ? 'correct' : '';
      const letterCls = isCorrect ? 'letter' : 'letter';
      // Escape HTML entities
      const text = q.a[origIdx].replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      answersHtml += `<li class="${cls}" data-correct="${origIdx === 0}"><span class="${letterCls}">${LETTERS[dispIdx]}.</span>${text}</li>`;
    });

    const qText = q.q.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const eText = q.e.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const topicHtml = q.t ? `<span class="q-topic">${q.t.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</span>` : '';

    card.innerHTML = `
      <div class="q-header">
        <span class="q-number">#${idx + 1}</span>
        <div class="q-meta">
          ${topicHtml}
          <span class="q-source ${sourceClass}">${sourceLabel}</span>
        </div>
      </div>
      <div class="q-text">${qText}</div>
      <ul class="q-answers">${answersHtml}</ul>
      <button class="q-explain-btn" onclick="this.nextElementSibling.classList.toggle('visible'); this.textContent = this.nextElementSibling.classList.contains('visible') ? 'Hide explanation' : 'Show explanation';">Show explanation</button>
      <div class="q-explanation">${eText}</div>
    `;

    list.appendChild(card);
  });
}

function filterSource(source) {
  currentFilter = source;

  document.getElementById('filterAll').className = 'ctrl-btn' + (source === 'all' ? ' active' : '');
  document.getElementById('filterSam').className = 'ctrl-btn' + (source === 'samantha' ? ' active' : '');
  document.getElementById('filterV1').className = 'ctrl-btn' + (source === 'working' ? ' active' : '');

  renderQuestions();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleAllCorrect() {
  showCorrect = !showCorrect;
  document.getElementById('toggleBtn').textContent = showCorrect ? 'Hide Correct Answers' : 'Show Correct Answers';
  renderQuestions();
}

// Back to top
window.addEventListener('scroll', function() {
  document.getElementById('backTop').className = 'back-top' + (window.scrollY > 400 ? ' visible' : '');
});

// Initial render
renderQuestions();
</script>
</body>
</html>
