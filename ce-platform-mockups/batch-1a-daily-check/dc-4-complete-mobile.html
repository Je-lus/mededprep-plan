<div class="grid grid-cols-7 gap-[3px] w-full pt-sm">
<!-- Generating 31 days. Assuming today is the 19th, and 12 days are active. -->
<script>
                        const days = 31;
                        const activeDays = [1, 2, 4, 5, 8, 9, 11, 14, 15, 16, 18, 19];
                        const today = 19;
                        
                        for(let i = 1; i <= days; i++) {
                            let classes = "h-4 rounded-[2px] w-full ";
                            if (activeDays.includes(i)) {
                                classes += "bg-primary-container ";
                                if(i === today) {
                                    classes += "active-day-glow ";
                                }
                            } else if (i < today) {
                                classes += "bg-border-subtle ";
                            } else {
                                classes += "bg-border-subtle/50 ";
                            }
                            document.write(`<div class="${classes}"></div>`);
                        }
                    </script>
</div>
