<style>
        body {
            background-color: #0A0A0A;
            color: #FFFFFF;
            font-family: 'Inter', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Ambient Background */
        .auth-background {
            position: fixed;
            inset: 0;
            z-index: -2;
            background: linear-gradient(135deg, #0A0A0A 0%, #0D1A12 50%, #0F3D26 75%, #36C98D 100%);
            opacity: 0.2;
        }

        /* Film Grain Overlay */
        .noise-overlay {
            position: fixed;
            inset: 0;
            z-index: -1;
            opacity: 0.04;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");

        /* Custom Input Styles */
        .input-field {
            background-color: #1A1A1A;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 0.5rem;
            height: 3rem;
            color: #FFFFFF;
            padding: 0.75rem 1rem;
            width: 100%;
            transition: all 0.2s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: #36C98D;
            box-shadow: 0 0 0 1px #36C98D;
        }

        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.45);
        }

        /* Primary Button Style */
        .btn-primary {
            background-color: #36C98D;
            color: #0A0A0A;
            font-weight: 600;
            height: 3rem;
            border-radius: 0.5rem;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: 0 0 20px rgba(54, 201, 141, 0.15);
        }

        .btn-primary:hover {
            background-color: #2DB87E;
            transform: translateY(-1px);
            box-shadow: 0 4px 24px rgba(54, 201, 141, 0.25);
        }

        /* Outline Button Style */
        .btn-outline {
            background-color: transparent;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #FFFFFF;
            font-weight: 500;
            height: 3rem;
            border-radius: 0.5rem;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            transition: all 0.2s ease;
        }

        .btn-outline:hover {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
        }

<script>
        // Simple password toggle interaction
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.querySelector('button[aria-label="Toggle password visibility"]');
            const passwordInput = document.getElementById('password');
            const iconSpan = toggleBtn.querySelector('span');

            if (toggleBtn && passwordInput) {
                toggleBtn.addEventListener('click', () => {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    iconSpan.textContent = type === 'password' ? 'visibility' : 'visibility_off';
                });
            }
        });
    </script>
