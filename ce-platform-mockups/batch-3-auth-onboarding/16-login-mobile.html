<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Pulse CE - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: {
                            DEFAULT: "#36C98D",
                            hover: "#2DB87E"
                        },
                        background: "#0A0A0A",
                        surface: {
                            DEFAULT: "#111111",
                            elevated: "#1A1A1A",
                            hover: "#1F1F1F"
                        },
                        border: {
                            subtle: "rgba(255,255,255,0.08)",
                            DEFAULT: "rgba(255,255,255,0.12)",
                            strong: "rgba(255,255,255,0.2)"
                        },
                        text: {
                            primary: "#FFFFFF",
                            secondary: "rgba(255,255,255,0.7)",
                            tertiary: "rgba(255,255,255,0.45)"
                        },
                        error: "#E5484D",
                        warning: "#F5A623"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "md": "0.375rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                    fontFamily: {
                        sans: ["Inter", "sans-serif"],
                        headline: ["Inter", "sans-serif"],
                        display: ["Inter", "sans-serif"],
                        body: ["Inter", "sans-serif"],
                        label: ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0A0A0A;
            color: #FFFFFF;
            /* Auth Background Gradient with noise */
            background-image: 
                linear-gradient(135deg, rgba(10, 10, 10, 0.85) 0%, rgba(13, 26, 18, 0.85) 50%, rgba(15, 61, 38, 0.85) 75%, rgba(54, 201, 141, 0.85) 100%),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .glow-shadow {
            box-shadow: 0 0 20px rgba(54,201,141,0.3);
        }
    </style>
</head>
<body class="antialiased w-[390px] mx-auto relative overflow-hidden">
<!-- Top Nav / Logo Container (Minimal Chrome for Auth) -->
<div class="flex flex-col items-center justify-center mb-8 pt-12">
<div class="flex flex-col items-center">
<!-- Logo Icon -->
<img alt="Pulse Shield Logo" class="w-7 h-7 mb-2 object-contain" src="https://lh3.googleusercontent.com/aida/ADBb0uiQuAMb-iPTR_teZtBbpKcjDXlkM3Bcp-UIgLeUUjUEF2W65wSPHVBpP3pJjeWAY99AvnhOqGgxUtccEez9Q_aKHcqrEifRFTh2nLLWFS6AqP6tvBEQ7Yf3QZCRVq_Z-wylzBiSmdPSZqxaOFU18n0RkBJ7ACE0Xhj44fyX-BQLkAhW9i0rnv9faoWKmBq24bp11kDJVtpSHiQLQSir6Yu_hQBp5OAGk2JX54sCzayhCS6WnsJEI3hXwS7Z"/>
<!-- Text Brand -->
<div class="text-center">
<h1 class="text-white text-[17px] font-bold tracking-tight leading-none mb-1 font-headline">PULSE</h1>
<p class="text-primary text-[10px] uppercase font-semibold tracking-[0.1em] font-label">BY MEDEDPREP</p>
</div>
</div>
</div>
<!-- Main Auth Card -->
<main class="w-full px-4 mb-6">
<div class="bg-surface border border-border rounded-2xl p-6 w-full max-w-[358px] mx-auto shadow-xl">
<div class="mb-6">
<h2 class="text-text-primary text-[22px] font-semibold leading-tight mb-1 font-headline tracking-tight">Welcome back</h2>
<p class="text-text-secondary text-[14px] font-body">Sign in to continue your training</p>
</div>
<form action="#" class="space-y-4" method="POST">
<!-- Email Input -->
<div>
<label class="block text-text-secondary text-[14px] font-medium mb-1.5 font-label" for="email">Email address</label>
<input class="w-full h-12 bg-surface-elevated border border-border rounded-lg px-4 text-text-primary placeholder:text-text-tertiary focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors text-sm" id="email" name="email" placeholder="you@agency.com" required="" type="email"/>
</div>
<!-- Password Input -->
<div>
<div class="flex justify-between items-center mb-1.5">
<label class="block text-text-secondary text-[14px] font-medium font-label" for="password">Password</label>
<a class="text-primary text-[14px] font-medium hover:text-primary-hover transition-colors" href="#">Forgot?</a>
</div>
<div class="relative">
<input class="w-full h-12 bg-surface-elevated border border-border rounded-lg pl-4 pr-12 text-text-primary placeholder:text-text-tertiary focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors text-sm" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-0 top-0 h-12 w-12 flex items-center justify-center text-text-secondary hover:text-text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-lg">visibility_off</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-12 mt-2 bg-primary hover:bg-primary-hover text-background font-semibold rounded-lg glow-shadow transition-all duration-200 flex items-center justify-center active:scale-[0.98]" type="submit">
                    Sign In
                </button>
<!-- Divider -->
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-border"></div>
<span class="flex-shrink-0 mx-4 text-text-tertiary text-xs">or</span>
<div class="flex-grow border-t border-border"></div>
</div>
<!-- Google Auth -->
<button class="w-full h-12 bg-transparent border border-border hover:bg-surface-hover text-text-primary font-medium rounded-lg transition-colors flex items-center justify-center gap-2 active:scale-[0.98]" type="button">
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25C22.56 11.47 22.49 10.72 22.36 10H12V14.26H17.92C17.66 15.63 16.88 16.81 15.69 17.61V20.35H19.26C21.35 18.42 22.56 15.6 22.56 12.25Z" fill="currentColor"></path>
<path d="M12 23C14.97 23 17.46 22.02 19.26 20.35L15.69 17.61C14.71 18.27 13.46 18.66 12 18.66C9.17 18.66 6.77 16.75 5.89 14.18H2.21V17.03C4.01 20.61 7.74 23 12 23Z" fill="currentColor"></path>
<path d="M5.89 14.18C5.66 13.5 5.53 12.77 5.53 12C5.53 11.23 5.66 10.5 5.89 9.82V6.97H2.21C1.47 8.44 1.05 10.16 1.05 12C1.05 13.84 1.47 15.56 2.21 17.03L5.89 14.18Z" fill="currentColor"></path>
<path d="M12 5.34C13.62 5.34 15.07 5.9 16.21 6.99L19.34 3.86C17.46 2.1 14.97 1.05 12 1.05C7.74 1.05 4.01 3.39 2.21 6.97L5.89 9.82C6.77 7.25 9.17 5.34 12 5.34Z" fill="currentColor"></path>
</svg>
                    Continue with Google
                </button>
</form>
</div>
</main>
<!-- Post-Card Links -->
<div class="text-center mb-12">
<p class="text-text-primary text-[14px]">
            Don't have an account? <a class="text-primary font-medium hover:text-primary-hover transition-colors" href="17-register-mobile.html">Create one</a>
</p>
</div>
<!-- Footer Tagline -->
<div class="absolute bottom-6 w-full text-center">
<p class="text-text-tertiary text-[11px] font-medium tracking-wide">Train. Track. Perform.</p>
</div>
</body></html>
